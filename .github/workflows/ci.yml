name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded PR run is cancelled; a push to main never is — release.yml and
# deploy-docs.yml key on this workflow's conclusion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (cascade layers + known tokens)
        run: pnpm lint:css

      - name: No hard-coded accessible names (i18n catalog is the source of truth)
        run: pnpm check:aria-labels

      - name: Typecheck
        run: pnpm typecheck

      - name: Version constant in sync with package.json
        run: node scripts/sync-version.mjs --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `pnpm test` above runs BEFORE the build, so every spec gated on built
      # output (`apps/docs/src/app/prerender-output.spec.ts` skips itself when
      # `dist/docs/browser` is missing) silently passes as zero tests. Re-run
      # the docs suite here, where the prerendered HTML exists — it is the only
      # automated check that a doc page paints without JS and server-renders a
      # real library component.
      - name: Test docs against the built output (prerender assertions)
        run: pnpm --filter docs test

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The Playwright config starts `ng serve docs`, which compiles the docs
      # app from library sources through the tsconfig path aliases — no
      # library build is needed first.
      #
      # Run from the REPO ROOT, not `--filter docs`. The filtered form sets the
      # cwd to apps/docs, and the dev server then resolves the workspace-root
      # relative entries in angular.json's `styles` array against apps/docs —
      # "ENOENT: apps/docs/packages/core/src/motion/motion.css". That stayed
      # invisible until e2e was re-enabled in CI.
      - name: E2E
        run: pnpm exec playwright test --config=playwright.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
