<kj-command-palette
  class="docs-search"
  [(kjOpen)]="svc.isOpen"
  [kjShouldFilter]="false"
  [kjQuery]="svc.query()"
  (kjQueryChange)="onQueryChange($event)"
  [kjItems]="svc.results()"
  kjHotkey="mod+k"
  kjAriaLabel="Search documentation"
  kjPlaceholder="Search components, directives, inputs..."
  (kjActivate)="onActivate($event)"
>
  <ng-template kjCommandPaletteItemTemplate let-result>
    <kj-command-item
      [kjValue]="result.slug + ':' + result.symbol"
      (click)="onResultClick(result)"
    >
      <div class="result-main">
        <span class="result-label">{{ result.symbol }}</span>
        <span class="result-type result-type-{{ result.kind }}">{{ result.kind }}</span>
        <span class="result-track result-track-{{ result.track }}">{{
          result.track === 'headless' ? 'Headless' : 'Components'
        }}</span>
      </div>
      <span class="result-path">
        {{ result.categoryPath.join(' / ') }}
        @if (result.via) {
          <span class="result-via">· matched {{ result.via }}</span>
        }
      </span>
    </kj-command-item>
  </ng-template>
</kj-command-palette>
