<!doctype html>
<html lang="en" data-theme="kouji">
  <head>
    <meta charset="utf-8" />
    <!--
      Pre-paint theme restore. The page is prerendered with the brand theme
      (data-theme="kouji" above, also the no-JS default); a returning visitor
      who picked another theme would otherwise see the dark brand paint first
      and flip after hydration. This runs before any stylesheet applies.
      Precedence mirrors ThemeService: ?theme= (transient) > localStorage.
      Theme names are validated against the same list the service uses;
      keep the two in sync when @kouji-ui/themes ships a new theme.
    -->
    <script>
      (function () {
        try {
          var themes = ['kouji','dark','light','retro','cyberpunk','corporate','sakura','bauhaus','dune','mint','forest','nord','terminal'];
          var fromUrl = new URLSearchParams(location.search).get('theme');
          var fromStorage = localStorage.getItem('kj-theme');
          var pick = themes.indexOf(fromUrl) >= 0 ? fromUrl : themes.indexOf(fromStorage) >= 0 ? fromStorage : null;
          if (pick) document.documentElement.setAttribute('data-theme', pick);
        } catch (e) { /* storage blocked: keep the prerendered theme */ }
      })();
    </script>
    <title>kouji-ui — Headless Angular UI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7T7JWWFDVR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // page_view is sent per navigation by AnalyticsTitleStrategy (SPA routing)
      gtag('config', 'G-7T7JWWFDVR', { send_page_view: false });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Archivo+Black&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
