# Render service definition for the documentation site.
#
# WHY THIS FILE EXISTS. The docs service was configured entirely in Render's
# dashboard, so nothing in the repository described how it was built or
# started. A review pass deleted `apps/docs/src/server.ts` and
# `apps/docs/src/serve-static.mjs` as dead code — correctly, as far as a grep
# could tell, because nothing in the tree referenced them — and the next deploy
# went straight to `update_failed`. Config that only exists in a dashboard
# cannot be grepped, reviewed, or kept honest by CI, and that is precisely how
# a file gets deleted out from under a running service.
#
# Keeping it here means the build and start commands move with the code that
# has to satisfy them.
#
# NOTE ON SERVICE TYPE. The docs build is `outputMode: "static"` — every route
# is prerendered at build time and there is no runtime server to speak of, so
# a Render **static site** (`type: web` + `runtime: static`) is the better fit:
# no Node process, no health check, no port. That change cannot be made by
# adopting this blueprint on an existing web service; it needs a new service.
# Until then this describes the web service that exists, which serves the same
# prerendered directory through `scripts/serve-docs-dist.mjs`.
services:
  - type: web
    name: kouji-ui-docs
    runtime: node
    plan: starter
    branch: main
    # The docs app compiles the libraries from source through the tsconfig path
    # aliases, so it needs the workspace install, not just its own.
    # NODE_OPTIONS mirrors vercel.json: the prerender of ~150 routes exceeds the
    # default heap on a small instance.
    buildCommand: pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 NG_BUILD_MAX_WORKERS=2 pnpm build:docs
    # `pnpm start` rather than a path, so moving or renaming the server does not
    # break the deploy. The script reads $PORT, which Render assigns per
    # instance and health-checks; a server hard-coded to another port builds
    # fine and then fails its health check.
    startCommand: pnpm start
    healthCheckPath: /
    autoDeploy: false # GitHub Actions triggers deploys; see .github/workflows/deploy-docs.yml
    envVars:
      - key: NODE_VERSION
        value: '22'
